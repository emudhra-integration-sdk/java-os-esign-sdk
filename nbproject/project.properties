# NetBeans uses nbbuild.xml; build.xml is the standalone Ant build used by CLI/CI.
buildfile=nbbuild.xml
annotation.processing.enabled=false
annotation.processing.enabled.in.editor=false
annotation.processing.processors.list=
annotation.processing.run.all.processors=true
annotation.processing.source.output=${build.generated.sources.dir}/ap-source-output
application.title=eSignASPLibrary
application.vendor=eMudhra Limited
build.classes.dir=${build.dir}/classes
build.classes.excludes=**/*.java,**/*.form
# This directory is removed when the project is cleaned:
build.dir=build
build.generated.dir=${build.dir}/generated
build.generated.sources.dir=${build.dir}/generated-sources
# Only compile against the classpath explicitly listed here:
build.sysclasspath=ignore
build.test.classes.dir=${build.dir}/test/classes
build.test.results.dir=${build.dir}/test/results
debug.classpath=\
    ${run.classpath}
debug.modulepath=\
    ${run.modulepath}
debug.test.classpath=\
    ${run.test.classpath}
debug.test.modulepath=\
    ${run.test.modulepath}
# This directory is removed when the project is cleaned:
dist.dir=dist
dist.jar=${dist.dir}/eSignASPLibrary5_13.jar
dist.javadoc.dir=${dist.dir}/javadoc
endorsed.classpath=
# Same exclusions as build.xml
excludes=Test.java,org/emcastle/util/test/**
includes=**
jar.archive.disabled=${jnlp.enabled}
jar.compress=true
jar.index=${jnlp.enabled}
file.reference.batik-all-1.17.jar=lib/batik-all-1.17.jar
file.reference.commons-io-2.14.0.jar=lib/commons-io-2.14.0.jar
file.reference.log4j-api-2.25.3.jar=lib/log4j-api-2.25.3.jar
file.reference.org.w3c.dom.svg-1.1.0.jar=lib/org.w3c.dom.svg-1.1.0.jar
file.reference.slf4j-api-1.7.32.jar=lib/slf4j-api-1.7.32.jar
file.reference.slf4j-simple-1.7.32.jar=lib/slf4j-simple-1.7.32.jar
file.reference.stax2-api-4.2.1.jar=lib/stax2-api-4.2.1.jar
file.reference.woodstox-core-6.4.0.jar=lib/woodstox-core-6.4.0.jar
file.reference.xmlgraphics-commons-2.9.jar=lib/xmlgraphics-commons-2.9.jar
file.reference.xmlsec-2.3.4.jar=lib/xmlsec-2.3.4.jar
javac.classpath=\
    ${file.reference.batik-all-1.17.jar}:\
    ${file.reference.commons-io-2.14.0.jar}:\
    ${file.reference.log4j-api-2.25.3.jar}:\
    ${file.reference.org.w3c.dom.svg-1.1.0.jar}:\
    ${file.reference.slf4j-api-1.7.32.jar}:\
    ${file.reference.slf4j-simple-1.7.32.jar}:\
    ${file.reference.stax2-api-4.2.1.jar}:\
    ${file.reference.woodstox-core-6.4.0.jar}:\
    ${file.reference.xmlgraphics-commons-2.9.jar}:\
    ${file.reference.xmlsec-2.3.4.jar}
# Space-separated list of extra javac options
javac.compilerargs=
javac.deprecation=false
javac.external.vm=false
javac.modulepath=
javac.processormodulepath=
javac.processorpath=\
    ${javac.classpath}
javac.source=11
javac.target=11
javac.test.classpath=\
    ${javac.classpath}:\
    ${build.classes.dir}
javac.test.modulepath=\
    ${javac.modulepath}
javac.test.processorpath=\
    ${javac.test.classpath}
javadoc.additionalparam=
javadoc.author=false
javadoc.encoding=${source.encoding}
javadoc.html5=false
javadoc.noindex=false
javadoc.nonavbar=false
javadoc.notree=false
javadoc.private=false
javadoc.splitindex=true
javadoc.use=true
javadoc.version=false
javadoc.windowtitle=
jlink.launcher=false
jlink.launcher.name=eSignASPLibrary
jnlp.codebase.type=no.codebase
jnlp.descriptor=application
jnlp.enabled=false
jnlp.mixed.code=default
jnlp.offline-allowed=false
jnlp.signed=false
jnlp.signing=
jnlp.signing.alias=
jnlp.signing.keystore=
# Library JAR: no Main-Class.
main.class=
manifest.file=manifest.mf
meta.inf.dir=${src.dir}/META-INF
mkdist.disabled=true
platform.active=C__Program_Files_Java_jdk-11
run.classpath=\
    ${javac.classpath}:\
    ${build.classes.dir}
run.jvmargs=
run.modulepath=\
    ${javac.modulepath}
run.test.classpath=\
    ${javac.test.classpath}:\
    ${build.test.classes.dir}
run.test.modulepath=\
    ${javac.test.modulepath}
source.encoding=UTF-8
src.dir=src
test.src.dir=test
